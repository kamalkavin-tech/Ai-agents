[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ops-agent"
version = "0.2.0"
description = "Evidence-driven, read-only incident diagnostic agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "google-genai>=2.19,<3",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.2,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx2>=2.12,<3", "pytest>=8,<9", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["agents*", "app*", "evaluation*", "tools*"]
